# The boards' Movies & TV list, made each night (tools/make_screen_list.py, from the Tally repo): screen.json, which
# every board reads. Free sources, no keys: Wikidata and Wikimedia's page views (CC0), TVmaze (CC BY-SA). The list is
# CC BY-SA.
name: Movies and TV list
on:
  schedule:
    - cron: "17 9 * * *"  # (each day, 9:17 UTC: early morning in the US)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the list
        run: python3 tools/make_screen_list.py screen.json
      - name: Publish it
        run: |
          git config user.name "Tally list"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Movies and TV list" && git push -q
